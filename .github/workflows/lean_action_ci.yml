name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build (Lean)
        uses: leanprover/lean-action@v1
        with:
          working-directory: lean4

      - name: Build docs (doc-gen)
        uses: leanprover-community/docgen-action@v1
        with:
          working-directory: lean4
